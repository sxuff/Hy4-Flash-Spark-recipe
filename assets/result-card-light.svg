<title id="t">Hy4 Flash on one DGX Spark: recipe v2.1 results</title>
<desc id="d">Decode 39.8 tok/s at temp 0, 37.1 at 0.7 and 40.5 at 0.9, against 39.7, 38.6 and 35.5 for v2 the same day. Prefill at 8K 764 tok/s vs 694 in v1. Model load 24 s vs 321 s. Retrieval passed at 200K tokens. Returning to a conversation 0.5 s vs 21 s.</desc>
